services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_2026
    ports:
      - "3307:3306"            # para conectarse desde afuera (Workbench, DBeaver, etc.)
    volumes:
      - dbdata:/var/lib/mysql
      # Los scripts se ejecutan automaticamente la primera vez que se crea el volumen
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_datos.sql:/docker-entrypoint-initdb.d/02_datos.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass_2026"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: torneo_futbol5
      DB_ADMIN_USER: app_admin
      DB_ADMIN_PASS: admin_pass_2026
      DB_PLANILLERO_USER: app_planillero
      DB_PLANILLERO_PASS: planillero_pass_2026
      SECRET_KEY: cambiar-en-produccion
    ports:
      - "5000:5000"

volumes:
  dbdata:
